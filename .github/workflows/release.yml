name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          environments: dev

      - name: build
        run: pixi run -e dev build

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*

  publish_dev_build:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: artifact
          path: dist

      - name: publish to test pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  release:
    needs: [publish_dev_build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
      # see https://github.com/softprops/action-gh-release/issues/236
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: add first release to changelog
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          sed -i "1a \n## v0.1.0 - $RELEASE_DATE\n\n- first release" CHANGELOG.md
        if: github.event.ref == 'refs/tags/v0.1.0'

      - name: update changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ github.ref_name }}
        # see https://github.com/requarks/changelog-action/issues/42
        if: github.event.ref != 'refs/tags/v0.1.0'

      - name: create release
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: artifact
          path: dist

      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: pre-commit on changelog
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --files CHANGELOG.md
        # we only run this to format CHANGELOG.md so pre-commit will fail (yet format it)
        continue-on-error: true

      - name: commit changelog
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          branch: main
          commit_message: 'docs: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]'
          file_pattern: CHANGELOG.md
